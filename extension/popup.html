<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TraceMail AI Sentry</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      width: 320px;
      background: #030712;
      color: #f1f5f9;
      padding: 16px;
      border: 1px solid rgba(6, 182, 212, 0.3);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 800;
      color: #22d3ee;
      letter-spacing: 0.5px;
    }
    .status-badge {
      font-size: 10px;
      font-family: monospace;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }
    .status-badge.offline {
      background: rgba(244, 63, 94, 0.2);
      border-color: rgba(244, 63, 94, 0.4);
      color: #fda4af;
    }
    .subtitle {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .action-btn {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #06b6d4);
      border: none;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      padding: 10px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 8px;
      transition: opacity 0.2s;
    }
    .action-btn:hover { opacity: 0.9; }
    .secondary-btn {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 600;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      display: block;
      text-align: center;
      text-decoration: none;
      margin-bottom: 10px;
    }
    .secondary-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .config-section {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 10px;
      margin-top: 10px;
    }
    .config-label {
      font-size: 10px;
      color: #64748b;
      margin-bottom: 4px;
      display: block;
      font-family: monospace;
    }
    .config-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 6px;
      color: #22d3ee;
      font-size: 11px;
      font-family: monospace;
      padding: 6px 8px;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>🛡️ TRACE-MAIL AI</span>
    </div>
    <span id="serverStatusBadge" class="status-badge">CHECKING...</span>
  </div>

  <p class="subtitle">
    AI-Powered Email Threat Sentry &amp; RFC 5322 Invariant Scanner.
  </p>

  <button id="auditTabBtn" class="action-btn">
    <span>⚡</span>
    <span>Audit Current Webmail Tab</span>
  </button>

  <a id="dashboardLink" href="http://localhost:8899" target="_blank" class="secondary-btn">
    🌐 Launch Full 3D Radar Console &rarr;
  </a>

  <div class="config-section">
    <label class="config-label">FORENSIC ENGINE ENDPOINT:</label>
    <input type="text" id="serverUrlInput" class="config-input" value="http://localhost:8899">
    <button id="saveUrlBtn" class="secondary-btn" style="margin-bottom:0; font-size:10px; padding:5px;">
      Save Endpoint
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
